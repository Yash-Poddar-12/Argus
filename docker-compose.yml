# Full local stack: PostgreSQL/Timescale/pgvector, Redis, MQTT, backend, frontend.
#   cp .env.example .env && docker compose up --build        (or: python scripts/dev.py up)
# Frontend: http://localhost:3000  ·  API: http://localhost:8000/docs
# New runtimes get a service here (one file for the whole stack; use profiles for optional services).
name: argus

services:
  db:
    image: timescale/timescaledb-ha:pg16   # PostgreSQL 16 + TimescaleDB + pgvector
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-argus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-argus-dev-password}
      POSTGRES_DB: ${POSTGRES_DB:-argus}
    ports: ["5432:5432"]
    volumes: [db-data:/home/postgres/pgdata/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-argus}"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

  mqtt:
    image: eclipse-mosquitto:2
    ports: ["1883:1883"]
    volumes: [./infra/docker/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro]

  backend:
    build: {context: ., dockerfile: backend/Dockerfile}
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-argus}:${POSTGRES_PASSWORD:-argus-dev-password}@db:5432/${POSTGRES_DB:-argus}
      REDIS_URL: redis://redis:6379/0
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    volumes: [./backend/app:/srv/backend/app, ./contracts:/srv/contracts]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 10s
      retries: 12

  frontend:
    build: {context: ./frontend}
    environment: {NEXT_PUBLIC_API_URL: "http://localhost:8000"}
    ports: ["3000:3000"]
    depends_on: [backend]

volumes:
  db-data:
