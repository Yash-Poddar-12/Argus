        zone_id:
          type: string
          pattern: ^[A-Z0-9_]{2,32}$
          title: Zone Id
        name:
          type: string
          title: Name
        zone_type:
          type: string
          enum:
          - TASK
          - HAZARD
          - RESTRICTED
          - DISPOSAL
          - SOFT_GROUND
          - OTHER
          title: Zone Type
        geometry:
          additionalProperties: true
          type: object
          title: Geometry
          description: GeoJSON Polygon, coordinates [lon, lat]
      type: object
      required:
      - zone_id
      - name
      - zone_type
      - geometry
      title: ZoneCreate
    ZoneDTO:
      properties:
        zone_id:
          type: string
          title: Zone Id
        site_id:
          type: string
          title: Site Id
        name:
          type: string
          title: Name
        zone_type:
          type: string
          enum:
          - TASK
          - HAZARD
          - RESTRICTED
          - DISPOSAL
          - SOFT_GROUND
          - OTHER
          title: Zone Type
        geometry:
          additionalProperties: true
          type: object
          title: Geometry
        status:
          type: string
          enum:
          - ACTIVE
          - INACTIVE
          - MAINTENANCE
          - RETIRED
          title: Status
          default: ACTIVE
      type: object
      required:
      - zone_id
      - site_id
      - name
      - zone_type
      - geometry
      title: ZoneDTO
    ZoneUpdate:
      properties:
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
        zone_type:
          anyOf:
          - type: string
            enum:
            - TASK
            - HAZARD
            - RESTRICTED
            - DISPOSAL
            - SOFT_GROUND
            - OTHER
          - type: 'null'
          title: Zone Type
        geometry:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Geometry
        status:
          anyOf:
          - type: string
            enum:
            - ACTIVE
            - INACTIVE
            - MAINTENANCE
            - RETIRED
          - type: 'null'
          title: Status
      type: object
      title: ZoneUpdate
  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer
