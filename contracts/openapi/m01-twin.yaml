components:
  schemas:
    AssignRequest:
      properties:
        operator_id:
          type: string
          title: Operator Id
        machine_id:
          type: string
          title: Machine Id
        replace:
          type: boolean
          title: Replace
          description: Cancel the current active assignment and reassign
          default: false
      type: object
      required:
      - operator_id
      - machine_id
      title: AssignRequest
    AssignmentCreate:
      properties:
        operator_id:
          type: string
          title: Operator Id
        machine_id:
          type: string
          title: Machine Id
        replace:
          type: boolean
          title: Replace
          description: Cancel the current active assignment and reassign
          default: false
        task_id:
          type: string
          title: Task Id
      type: object
      required:
      - operator_id
      - machine_id
      - task_id
      title: AssignmentCreate
    AssignmentDTO:
      properties:
        assignment_id:
          type: string
          title: Assignment Id
        task_id:
          type: string
          title: Task Id
        operator_id:
          type: string
          title: Operator Id
        machine_id:
          type: string
          title: Machine Id
        site_id:
          type: string
          title: Site Id
        assigned_by:
          type: string
          title: Assigned By
        status:
          type: string
          enum:
          - ACTIVE
          - CANCELLED
          - COMPLETED
          title: Status
        created_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Created At
      type: object
      required:
      - assignment_id
      - task_id
      - operator_id
      - machine_id
      - site_id
      - assigned_by
      - status
      title: AssignmentDTO
    AssignmentUpdate:
      properties:
        status:
          anyOf:
          - type: string
            pattern: ^CANCELLED$
          - type: 'null'
          title: Status
        machine_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Machine Id
      type: object
      title: AssignmentUpdate
    AssistanceItem:
      properties:
        kind:
          type: string
          enum:
          - MACHINE
          - PERSON
          - RESOURCE
          - NOTE
          title: Kind
        resource_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Resource Id
        note:
          anyOf:
          - type: string
          - type: 'null'
          title: Note
      type: object
      required:
      - kind
      title: AssistanceItem
    ConditionsUpdate:
      properties:
        conditions:
          $ref: '#/components/schemas/EnvironmentConditions'
        zone_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Zone Id
        source:
          type: string
          title: Source
          default: MANUAL
      type: object
      required:
      - conditions
      title: ConditionsUpdate
    ConfirmMachineRequest:
      properties:
        machine_id:
          type: string
          title: Machine Id
      type: object
      required:
      - machine_id
      title: ConfirmMachineRequest
    ConfirmMachineResponse:
      properties:
        operator_id:
          type: string
          title: Operator Id
        machine_id:
          type: string
          title: Machine Id
        confirmed_at:
          type: string
          format: date-time
          title: Confirmed At
      type: object
      required:
      - operator_id
      - machine_id
      - confirmed_at
      title: ConfirmMachineResponse
    EnvironmentConditions:
      properties:
        weather:
          type: string
          enum:
          - CLEAR
          - CLOUDY
          - RAIN
          - STORM
          - FOG
          title: Weather
          default: CLEAR
        temperature_c:
          type: number
          title: Temperature C
          default: 30.0
        rain_mm_h:
          type: number
          minimum: 0.0
          title: Rain Mm H
          default: 0.0
        visibility:
          type: string
          enum:
          - GOOD
          - MODERATE
          - POOR
          title: Visibility
          default: GOOD
        soil:
          type: string
          enum:
          - DRY
          - WET
          - MUD
          - ROCKY
          title: Soil
          default: DRY
      type: object
      title: EnvironmentConditions
    GeoPoint:
      properties:
        lat:
          type: number
          maximum: 90.0
          minimum: -90.0
          title: Lat
        lon:
          type: number
          maximum: 180.0
          minimum: -180.0
          title: Lon
      type: object
      required:
      - lat
      - lon
      title: GeoPoint
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    IngestResult:
      properties:
        received:
          type: integer
          title: Received
        accepted:
          type: integer
          title: Accepted
        duplicates:
          type: integer
          title: Duplicates
      type: object
      required:
      - received
      - accepted
      - duplicates
      title: IngestResult
    OperationalTwin:
      properties:
        operator_id:
          type: string
          title: Operator Id
        machine_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Machine Id
        task_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Task Id
        site_id:
          type: string
          title: Site Id
        as_of:
          type: string
          format: date-time
          title: As Of
        state:
          $ref: '#/components/schemas/TwinState'
        intelligence:
          $ref: '#/components/schemas/TwinIntelligence'
        freshness:
          $ref: '#/components/schemas/TwinFreshness'
      type: object
      required:
      - operator_id
      - site_id
      - as_of
      - state
      - intelligence
      - freshness
      title: OperationalTwin
      description: 'Human-Machine Operational Twin: state layer + intelligence layer (master §4).'
    PrecheckAnswer:
      properties:
        item_id:
          type: string
          title: Item Id
        ok:
          type: boolean
          title: Ok
        note:
          anyOf:
          - type: string
          - type: 'null'
          title: Note
      type: object
      required:
      - item_id
      - ok
      title: PrecheckAnswer
    PrecheckItem:
      properties:
        item_id:
          type: string
          title: Item Id
        label:
          type: string
          title: Label
        critical:
          type: boolean
          title: Critical
          default: false
      type: object
      required:
      - item_id
      - label
      title: PrecheckItem
    PrecheckResultDTO:
      properties:
        precheck_id:
          type: string
          title: Precheck Id
        machine_id:
          type: string
          title: Machine Id
        operator_id:
          type: string
          title: Operator Id
        template_id:
          type: string
          title: Template Id
        passed:
          type: boolean
