# Alembic config. Run from the repo root:
#   uv run alembic -c backend/alembic.ini upgrade head
#   python scripts/dev.py revision -m "add x"      (autogenerate a new linear revision)
# History is linear since revision a1b2c3d4e5f6 (merge of the pre-restructure per-module branches).

[alembic]
script_location = %(here)s/migrations
version_locations = %(here)s/migrations/versions
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
