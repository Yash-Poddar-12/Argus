[project]
name = "argus-backend"
version = "0.1.0"
description = "ARGUS backend: API, domain services, operational twin, copilot tools, IoT simulator"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.30",
    "alembic>=1.13",
    "aiosqlite>=0.20",
    "asyncpg>=0.29",
    "redis>=5.0",
    "pyjwt>=2.8",
    "prometheus-client>=0.20",
    "jsonschema>=4.22",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "tzdata>=2024.1",
]

[project.scripts]
argus-sim = "app.iot.simulator.cli:main"
argus-seed = "app.seed.__main__:run"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
