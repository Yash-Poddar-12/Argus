# Workspace root (uv). Python packages live in their own folders:
#   backend/  -> argus-backend (import package `app`)
#   ml/       -> added as a workspace member when it gets code (see ml/README.md)
# `uv sync` at the repo root installs everything; run tools from the repo root.

[project]
name = "argus-workspace"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["argus-backend"]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "fakeredis>=2.23",
    "ruff>=0.5",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["backend"]

[tool.uv.sources]
argus-backend = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 130
target-version = "py312"
extend-exclude = ["frontend", "backend/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]
