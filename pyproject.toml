[project]
name = "argus"
version = "0.1.0"
description = "CAT Operator & Site Intelligence Platform (backend, simulator, edge)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.30",
    "alembic>=1.13",
    "aiosqlite>=0.20",
    "asyncpg>=0.29",
    "redis>=5.0",
    "pyjwt>=2.8",
    "prometheus-client>=0.20",
    "jsonschema>=4.22",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "fakeredis>=2.23",
    "ruff>=0.5",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 130
target-version = "py312"
extend-exclude = ["frontend", "backend/migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.hatch.build.targets.wheel]
packages = ["backend", "simulator"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
