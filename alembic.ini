# Alembic config (M00). One branch per module:
#   backend/migrations/<module>/<rev>_*.py  with  branch_labels = ("<module>",) on the first revision.
# Apply everything:            uv run alembic upgrade heads
# New revision for a module:   uv run alembic revision -m "msg" --head <module>@head
#                              (first one: --head base --branch-label <module> --version-path backend/migrations/<module>)
# Versions are discovered recursively, so adding a module never edits this file.

[alembic]
script_location = %(here)s/backend/core/migrations_env
version_locations = %(here)s/backend/migrations
recursive_version_locations = true
path_separator = os
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
