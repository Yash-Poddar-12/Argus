name: ci

on:
  pull_request:
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: {python-version: "3.12"}
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check backend scripts
      - name: Contracts valid
        run: uv run python scripts/contracts.py check
      - name: Generated contracts match code
        run: uv run python scripts/contracts.py export --check
      - name: Migrations apply to a clean database
        run: uv run alembic -c backend/alembic.ini upgrade head
        env: {DATABASE_URL: "sqlite+aiosqlite:///./ci-migrations.db"}
      - name: Tests (SQLite + in-memory bus; includes architecture rules)
        run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: frontend}}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: {version: 9}
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: pnpm, cache-dependency-path: frontend/pnpm-lock.yaml}
      - run: pnpm install --frozen-lockfile
      - name: API types match contracts
        run: pnpm generate && git diff --exit-code -- src/lib/api/generated
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
        env: {NEXT_TELEMETRY_DISABLED: "1"}

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compose file is valid
        run: cp .env.example .env && docker compose config -q
      - name: Images build
        run: docker compose build backend frontend

  status-reminder:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Warn when code changed without a workstream status update
        run: |
          changed=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          echo "$changed" | grep -q "docs/development/workstreams/" \
            || echo "::warning::No workstream file updated in this PR (docs/development/SYNC_PROTOCOL.md)"
